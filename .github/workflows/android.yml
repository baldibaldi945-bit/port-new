name: Build ModBridge APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ModBridge.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run core tests and build debug APK
        working-directory: ModBridge
        run: gradle test assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ModBridge-debug-apk
          path: ModBridge/app/build/outputs/apk/debug/app-debug.apk
